<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" role="img" aria-labelledby="title desc">
  <title id="title">Validity before four hard gates</title>
  <desc id="desc">An expired case stops at validity without running the agent or receiving a grade while a valid case runs the agent and checks cause, evidence, distraction, and steps, with any failed gate failing the result</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <style>
      .name { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; fill:#12222F; }
      .zone { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; fill:#5B6B78; letter-spacing:1.5px; }
      .detail { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:400; fill:#5B6B78; }
    </style>
  </defs>

  <rect width="760" height="390" fill="#FFFFFF"/>
  <text x="380" y="35" text-anchor="middle" class="name" font-size="23">Validity before four hard gates</text>

  <rect x="22" y="80" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="42" y="113" class="name" font-size="18">Validity preflight</text>
  <text x="42" y="139" class="detail" font-size="13">Case still in the suite</text>

  <rect x="300" y="80" width="150" height="82" rx="12" fill="#BACFE3" stroke="#000000" stroke-width="2"/>
  <text x="375" y="113" text-anchor="middle" class="name" font-size="19">Agent runs</text>
  <text x="375" y="139" text-anchor="middle" class="detail" font-size="13">Conclusion</text>

  <rect x="500" y="68" width="238" height="244" rx="12" fill="#F2F5F8" stroke="#000000" stroke-width="2"/>
  <text x="619" y="98" text-anchor="middle" class="zone" font-size="12">HARD GATES</text>
  <line x1="516" y1="108" x2="722" y2="108" stroke="#C3CED8" stroke-width="1.5"/>
  <text x="520" y="142" class="name" font-size="18">Cause</text>
  <line x1="516" y1="157" x2="722" y2="157" stroke="#C3CED8" stroke-width="1.5"/>
  <text x="520" y="190" class="name" font-size="18">Evidence</text>
  <line x1="516" y1="205" x2="722" y2="205" stroke="#C3CED8" stroke-width="1.5"/>
  <text x="520" y="238" class="name" font-size="18">Distraction</text>
  <line x1="516" y1="253" x2="722" y2="253" stroke="#C3CED8" stroke-width="1.5"/>
  <text x="520" y="286" class="name" font-size="18">Steps</text>

  <rect x="22" y="256" width="220" height="74" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="42" y="285" class="name" font-size="18">Expired case stops</text>
  <text x="42" y="309" class="detail" font-size="13">No agent run, no grade</text>

  <rect x="500" y="336" width="238" height="42" rx="12" fill="#BACFE3" stroke="#000000" stroke-width="2"/>
  <text x="619" y="363" text-anchor="middle" class="name" font-size="17">One failed gate: FAIL</text>

  <path d="M243,121 H295" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="269" y="108" text-anchor="middle" class="detail" font-size="12">valid</text>
  <path d="M451,121 H495" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M132,163 V251" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="142" y="216" class="detail" font-size="12">expired</text>
  <path d="M619,313 V331" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
</svg>