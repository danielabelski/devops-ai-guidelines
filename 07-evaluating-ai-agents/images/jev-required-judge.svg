<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-label="After the agent commits, hard gates check facts and actions while Jev judges the explanation, both must pass for a complete pass, a hard gate failure remains a failure even when Jev passes, and unavailable Jev makes the evaluation incomplete">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <style>
      .name { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; fill:#12222F; }
      .zone { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; fill:#5B6B78; letter-spacing:1.5px; }
      .detail { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:400; fill:#5B6B78; }
    </style>
  </defs>

  <rect width="760" height="510" fill="#FFFFFF"/>
  <text x="380" y="35" text-anchor="middle" class="name" font-size="23">A complete grade needs both checks</text>

  <rect x="270" y="67" width="220" height="76" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="380" y="98" text-anchor="middle" class="name" font-size="19">Agent commits</text>
  <text x="380" y="123" text-anchor="middle" class="detail" font-size="13">One recorded run</text>

  <rect x="72" y="192" width="250" height="90" rx="12" fill="#BACFE3" stroke="#000000" stroke-width="2"/>
  <text x="197" y="228" text-anchor="middle" class="name" font-size="19">Hard gates</text>
  <text x="197" y="256" text-anchor="middle" class="detail" font-size="13">Facts and actions</text>

  <rect x="438" y="192" width="250" height="90" rx="12" fill="#BACFE3" stroke="#000000" stroke-width="2"/>
  <text x="563" y="228" text-anchor="middle" class="name" font-size="19">Required Jev</text>
  <text x="563" y="256" text-anchor="middle" class="detail" font-size="13">Explanation judgment</text>

  <rect x="183" y="355" width="394" height="136" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="380" y="387" text-anchor="middle" class="zone" font-size="12">EVALUATION STATUS</text>
  <line x1="202" y1="399" x2="558" y2="399" stroke="#C3CED8" stroke-width="1.5"/>
  <text x="205" y="424" class="name" font-size="16">Both pass: PASS</text>
  <text x="205" y="449" class="detail" font-size="13">Hard gate fails: FAIL, even if Jev passes</text>
  <text x="205" y="474" class="detail" font-size="13">Jev unavailable: INCOMPLETE, never PASS</text>

  <path d="M380,144 V165 H197 V187" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M380,165 H563 V187" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M197,283 V319 H280 V350" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M563,283 V319 H480 V350" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
</svg>