<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
  <title id="title">Evidence claims against the runner record</title>
  <desc id="desc">The agent must cite both get_deploys and get_db_status, and the runner must record calls and returned observations for both tools before the evidence gate passes</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
    <style>
      .name { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; fill:#12222F; }
      .zone { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:700; fill:#5B6B78; letter-spacing:1.5px; }
      .detail { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; font-weight:400; fill:#5B6B78; }
      .code { font-family:SFMono-Regular,Menlo,Consolas,monospace; font-weight:400; fill:#12222F; }
    </style>
  </defs>

  <rect width="760" height="370" fill="#FFFFFF"/>
  <text x="380" y="35" text-anchor="middle" class="name" font-size="23">Claims meet the runner record</text>

  <text x="132" y="77" text-anchor="middle" class="zone" font-size="12">AGENT CLAIM</text>
  <text x="504" y="77" text-anchor="middle" class="zone" font-size="12">RUNNER RECORD</text>

  <rect x="18" y="94" width="228" height="140" rx="12" fill="#BACFE3" stroke="#000000" stroke-width="2"/>
  <text x="132" y="127" text-anchor="middle" class="name" font-size="19">Cited evidence</text>
  <text x="132" y="164" text-anchor="middle" class="code" font-size="13">get_deploys</text>
  <text x="132" y="191" text-anchor="middle" class="code" font-size="13">get_db_status</text>

  <rect x="266" y="94" width="228" height="140" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="380" y="127" text-anchor="middle" class="name" font-size="19">Actual tool calls</text>
  <text x="380" y="164" text-anchor="middle" class="code" font-size="13">get_deploys</text>
  <text x="380" y="191" text-anchor="middle" class="code" font-size="13">get_db_status</text>

  <rect x="514" y="94" width="228" height="140" rx="12" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
  <text x="628" y="127" text-anchor="middle" class="name" font-size="18">Returned observations</text>
  <text x="628" y="164" text-anchor="middle" class="code" font-size="13">get_deploys</text>
  <text x="628" y="191" text-anchor="middle" class="code" font-size="13">get_db_status</text>

  <rect x="258" y="292" width="244" height="62" rx="12" fill="#BACFE3" stroke="#000000" stroke-width="2"/>
  <text x="380" y="319" text-anchor="middle" class="name" font-size="18">Evidence gate passes</text>
  <text x="380" y="340" text-anchor="middle" class="detail" font-size="13">Only when both tools match</text>

  <path d="M132,235 V266 H380" stroke="#000000" stroke-width="2.5" fill="none"/>
  <path d="M380,235 V266" stroke="#000000" stroke-width="2.5" fill="none"/>
  <path d="M628,235 V266 H380" stroke="#000000" stroke-width="2.5" fill="none"/>
  <path d="M380,266 V287" stroke="#000000" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
</svg>